services:
  - type: web
    name: quickdrop-signaling
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @quickdrop/protocol build && pnpm --filter @quickdrop/signaling build
    startCommand: node apps/signaling/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Public address, not a secret.
      - key: ALLOWED_ORIGINS
        value: https://quickdrop-web-ypyd.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SESSION_TTL_MS
        value: "300000"
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false

  - type: web
    runtime: static
    name: quickdrop-web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @quickdrop/protocol build && pnpm --filter @quickdrop/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public address, not a secret.
      - key: VITE_SIGNALING_URL
        value: wss://quickdrop-signaling-t2a5.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
